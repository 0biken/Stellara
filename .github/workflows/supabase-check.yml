name: Supabase integration

on:
  push:
    paths:
      [
        "supabase/**",
        "apps/web/**",
        "packages/**",
        "pnpm-lock.yaml",
        ".github/workflows/supabase-check.yml",
      ]
  pull_request:
    paths:
      [
        "supabase/**",
        "apps/web/**",
        "packages/**",
        "pnpm-lock.yaml",
        ".github/workflows/supabase-check.yml",
      ]

permissions:
  contents: read

jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:prepare
      - name: Start a clean synthetic stack
        run: |
          umask 077
          {
            echo 'STELLARA_ENV=local'
            echo 'STELLARA_WEB_ORIGINS=http://localhost:3000'
            echo "STELLARA_PIN_PEPPER=$(openssl rand -hex 32)"
            echo "STELLARA_CHILD_JWT_SECRET=$(openssl rand -hex 32)"
          } > supabase/functions/.env
          supabase start
          supabase db reset --local
          supabase test db
      - name: Verify the live family flow
        run: |
          eval "$(supabase status -o env)"
          export STELLARA_TEST_URL="$API_URL"
          export STELLARA_TEST_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export STELLARA_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          node --test supabase/tests/live-family.test.mjs
      - name: Verify the live browser flow
        run: |
          eval "$(supabase status -o env)"
          export STELLARA_TEST_URL="$API_URL"
          export STELLARA_TEST_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export STELLARA_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$STELLARA_TEST_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STELLARA_TEST_PUBLISHABLE_KEY"
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm check:client
          pnpm exec playwright test -c supabase/browser/playwright.config.mjs
      - if: always()
        run: supabase stop
