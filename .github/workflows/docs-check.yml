# Formatting and generated-docs freshness. Lint, tests, the UI browser specs,
# the web build and performance budgets moved to ci.yml.
name: Docs check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node docs/tools/tokens.mjs
      - run: pnpm docs:generate
      - run: node docs/tools/check-generated.mjs
